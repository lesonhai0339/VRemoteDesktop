name: .NET Framework 4.0 Desktop

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug]
    
    runs-on: windows-latest
    
    env:
      Solution_Name: VRemoteDesktop.sln
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: nuget restore $env:Solution_Name
    
    - name: Build solution
      run: msbuild $env:Solution_Name /p:Configuration=${{ matrix.configuration }}
    
    - name: Run unit tests
      run: |
        $testAssemblies = Get-ChildItem -Recurse -Filter "*test*.dll" | Where-Object {
          $_.DirectoryName -like "*bin\${{ matrix.configuration }}*"
        }
        foreach ($assembly in $testAssemblies) {
          vstest.console.exe $assembly.FullName
        }
      shell: powershell
